name: Laboratório da lagoa
on:
  push:
    paths:
      - 'lab/**'
      - '.github/workflows/lagoon.yml'
  pull_request:
    paths:
      - 'lab/**'
      - '.github/workflows/lagoon.yml'

permissions:
  contents: read

jobs:
  lagoon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:sites
      - name: Arquivo científico em PostgreSQL
        working-directory: lab/test/postgres
        run: |
          npm ci
          npm test
